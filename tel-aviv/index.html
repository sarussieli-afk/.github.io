<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111113">
<title>תל אביב בתלת מימד</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap">
<style>
  /* One full-screen dark map; quiet chrome floats over it at the top and bottom edges */
  :root{
    --ground:#111113; --sea:#060709; --panel:rgba(16,16,19,.84); --line:rgba(255,255,255,.09);
    --text:#f1f1f3; --muted:#8b8b93;
    --sans:"Heebo","Rubik","Segoe UI",Arial,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;overflow:hidden}
  body{background:var(--ground);color:var(--text);font-family:var(--sans);direction:rtl}
  #map{position:fixed;inset:0}
  /* minimal MapLibre core styles (the library stylesheet is not loaded) */
  .maplibregl-map{overflow:hidden;position:relative;-webkit-user-select:none;user-select:none}
  .maplibregl-canvas{position:absolute;left:0;top:0}
  .maplibregl-canvas-container.maplibregl-interactive{cursor:grab}
  .maplibregl-canvas-container.maplibregl-interactive:active{cursor:grabbing}
  .maplibregl-marker{position:absolute;top:0;left:0;will-change:transform}

  .top{position:fixed;top:0;inset-inline:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 28px;background:linear-gradient(var(--ground),rgba(17,17,19,0));pointer-events:none}
  .brand{display:flex;flex-direction:column;gap:2px}
  .brand b{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .brand small{font-size:12px;color:var(--muted)}
  .tools{display:flex;gap:8px;pointer-events:auto}
  .tools button{border:1px solid var(--line);background:var(--panel);color:var(--text);font:600 13px var(--sans);padding:8px 12px;border-radius:10px;cursor:pointer;backdrop-filter:blur(10px)}
  .tools button[aria-pressed="true"]{background:var(--text);color:var(--ground)}
  button:focus-visible,.hood:focus-visible{outline:2px solid #fff;outline-offset:2px}

  .bottom{position:fixed;bottom:0;inset-inline:0;z-index:3;padding:28px 0 calc(env(safe-area-inset-bottom,0px) + 12px);
    background:linear-gradient(rgba(17,17,19,0),var(--ground) 55%);display:flex;flex-direction:column;gap:8px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);
    font:600 14px var(--sans);padding:8px 14px;border-radius:999px;cursor:pointer;backdrop-filter:blur(10px)}
  .chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
  .chip.on{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
  .attr{padding:0 16px;font-size:10.5px;color:var(--muted);direction:ltr;text-align:left}

  .hood{font:700 16px var(--sans);padding:5px 11px;border-radius:9px;white-space:nowrap;cursor:pointer;color:var(--c);
    background:color-mix(in srgb,var(--c) 15%,rgba(12,12,14,.86));border:1.5px solid color-mix(in srgb,var(--c) 65%,transparent);
    box-shadow:0 4px 18px rgba(0,0,0,.55);transition:transform .25s,background .25s,color .25s}
  .hood.on{transform:scale(1.12);color:#fff;background:color-mix(in srgb,var(--c) 48%,rgba(12,12,14,.9))}

  .card{position:fixed;z-index:4;top:calc(env(safe-area-inset-top,0px) + 70px);inset-inline-end:16px;width:min(260px,calc(100% - 32px));
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:4px}
  .card h2{margin:0;font-size:16px;font-weight:800}
  .card p{margin:0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .card .big{font-size:26px;font-weight:800;color:var(--text);line-height:1.1}
  .card .x{position:absolute;inset-inline-start:8px;top:6px;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}

  .loading{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:var(--ground);color:var(--muted);font-size:14px;transition:opacity .6s}
  .loading.done{opacity:0;pointer-events:none}
  @media (prefers-reduced-motion:reduce){.hood{transition:none}}
</style>
</head>
<body>

<div id="map"></div>
<div class="loading" id="loading">טוען 43,000 בניינים…</div>

<header class="top">
  <div class="brand"><b>תל אביב</b><small>כל בניין בגובה האמיתי שלו</small></div>
  <div class="tools">
    <button id="orbit" aria-pressed="true">סיבוב</button>
    <button id="dim" aria-pressed="true">3D</button>
  </div>
</header>

<aside class="card" id="card" hidden>
  <button class="x" id="cardX" aria-label="סגירה">×</button>
  <h2 id="cName"></h2>
  <div class="big" id="cH"></div>
  <p id="cMeta"></p>
</aside>

<footer class="bottom">
  <nav class="chips" id="chips"></nav>
  <div class="attr" id="attr"></div>
</footer>

<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script>
  // מרכזי שכונות ורדיוס הצביעה במטרים
  const HOODS = [
    { name: 'לב העיר',     c: [34.7740, 32.0735], r: 620, color: '#6aa8ff' },
    { name: 'הצפון הישן',  c: [34.7768, 32.0882], r: 650, color: '#a98bfa' },
    { name: 'פלורנטין',    c: [34.7685, 32.0565], r: 420, color: '#f2b84b' },
    { name: 'נווה צדק',    c: [34.7655, 32.0620], r: 320, color: '#f47ab8' },
    { name: 'כרם התימנים', c: [34.7680, 32.0702], r: 250, color: '#3fd49c' },
    { name: 'יפו העתיקה',  c: [34.7522, 32.0545], r: 380, color: '#fb8f4a' },
    { name: 'שרונה',       c: [34.7880, 32.0725], r: 380, color: '#2fd0e8' },
    { name: 'הצפון החדש',  c: [34.7850, 32.0925], r: 600, color: '#c58bfc' },
    { name: 'הנמל',        c: [34.7745, 32.0975], r: 350, color: '#4cb8f5' },
    { name: 'בבלי',        c: [34.7960, 32.0925], r: 380, color: '#55dc84' },
    { name: 'כיכר המדינה', c: [34.7898, 32.0868], r: 190, color: '#ff6b6b' },
    { name: 'רמת אביב',    c: [34.7990, 32.1135], r: 700, color: '#f5cf3a' },
  ];
  const KX = 111320 * Math.cos(32.08 * Math.PI / 180), KY = 110950;

  const GREY = ['interpolate', ['linear'], ['get', 'h'], 0, '#46464c', 15, '#6c6c73', 45, '#a3a3aa', 140, '#e9e9ec'];
  const shade = (hex, t) => { const n = parseInt(hex.slice(1), 16);
    return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(t < 0 ? v * (1 + t) : v + (255 - v) * t).toString(16).padStart(2, '0')).join(''); };

  // ---- פענוח הנתונים הדחוסים ----
  function decode(D) {
    const [X0, Y0] = D.origin, q = D.q;
    const ring = d => { const o = []; let x = 0, y = 0;
      for (let i = 0; i < d.length; i += 2) { x += d[i]; y += d[i + 1]; o.push([X0 + x / q, Y0 + y / q]); } return o; };
    const closed = d => { const r = ring(d); r.push(r[0]); return r; };
    const nearestHood = ([x, y]) => { let best = -1, bd = 1e9;
      HOODS.forEach((h, i) => { const d = Math.hypot((x - h.c[0]) * KX, (y - h.c[1]) * KY); if (d < h.r && d < bd) { bd = d; best = i; } });
      return best; };
    const fc = f => ({ type: 'FeatureCollection', features: f });
    const buildings = D.b.map(([h, mh, est, fl, nm, ...rings], id) => {
      const outer = closed(rings[0]);
      return { type: 'Feature', id,
        properties: { h, mh, est, fl, nm: nm || '', n: nearestHood(outer[0]) },
        geometry: { type: 'Polygon', coordinates: [outer, ...rings.slice(1).map(closed)] } };
    });
    const roads = D.r.map(([c, ...d]) => ({ type: 'Feature', properties: { c: D.rc[c] }, geometry: { type: 'LineString', coordinates: ring(d) } }));
    const water = D.w.map(rs => ({ type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: rs.map(closed) } }));
    const green = D.g.map(([s, ...rs]) => ({ type: 'Feature', properties: { s }, geometry: { type: 'Polygon', coordinates: rs.map(closed) } }));
    return { buildings: fc(buildings), roads: fc(roads), water: fc(water), green: fc(green) };
  }

  // ---- מגדלי כיכר המדינה (בבנייה): לפי נתוני הפרויקט, המיקום בתוך הכיכר מקורב ----
  // שני מגדלים 160 מ׳ / 40 קומות, מגדל מזרחי 157 מ׳ / 37 קומות, כל קומה מסובבת 1.25° ביחס לקומה שמתחתיה
  const KIKAR = { c: [34.78985, 32.08683], R: 132,
    towers: [
      { nm: 'מגדלי כיכר המדינה · צפוני', ang: 90,  floors: 40, h: 160 },
      { nm: 'מגדלי כיכר המדינה · מזרחי', ang: -10, floors: 37, h: 157 },
      { nm: 'מגדלי כיכר המדינה · דרומי', ang: 250, floors: 40, h: 160 },
    ] };
  const off = ([x, y], dx, dy) => [x + dx / KX, y + dy / KY];
  function kikarFeatures() {
    const bld = [], ground = [], [cx, cy] = KIKAR.c;
    KIKAR.towers.forEach((t, ti) => {
      const a = t.ang * Math.PI / 180, center = off(KIKAR.c, 78 * Math.cos(a), 78 * Math.sin(a));
      const fh = t.h / t.floors;
      for (let f = 0; f < t.floors; f++) {
        const rot = (f * 1.25 + t.ang) * Math.PI / 180, pts = [];
        // קומה טיפוסית: מרובע מעוגל ~30×30 מ׳
        for (let k = 0; k <= 32; k++) {
          const th = k / 32 * 2 * Math.PI, c = Math.cos(th), s = Math.sin(th);
          const r = 15 / Math.pow(Math.pow(Math.abs(c), 4) + Math.pow(Math.abs(s), 4), 0.25);
          pts.push(off(center, r * Math.cos(th + rot), r * Math.sin(th + rot)));
        }
        pts[pts.length - 1] = pts[0];
        bld.push({ type: 'Feature', properties: { h: +((f + 1) * fh - 0.35).toFixed(2), mh: +(f * fh).toFixed(2), est: 0, fl: t.floors, nm: t.nm, n: -1, kikar: 1 },
          geometry: { type: 'Polygon', coordinates: [pts] } });
      }
    });
    // מבנה ציבור בן 10 קומות (מערב הכיכר)
    const pb = off(KIKAR.c, -80, -10), pbr = [[-16, -12], [16, -12], [16, 12], [-16, 12], [-16, -12]].map(([dx, dy]) => off(pb, dx, dy));
    bld.push({ type: 'Feature', properties: { h: 40, mh: 0, est: 1, fl: 10, nm: 'כיכר המדינה · מבנה ציבור', n: -1, kikar: 1 }, geometry: { type: 'Polygon', coordinates: [pbr] } });
    // פארק ואגם אקולוגי
    ground.push({ type: 'Feature', properties: { s: 0 }, geometry: circle(KIKAR.c, KIKAR.R - 6).geometry });
    const lake = []; for (let k = 0; k <= 48; k++) { const th = k / 48 * 2 * Math.PI; lake.push(off(KIKAR.c, 38 * Math.cos(th) - 5, 22 * Math.sin(th) - 30)); }
    return { bld, ground, lake: { type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [lake] } } };
  }

  const MAJOR = ['motorway', 'trunk', 'primary', 'secondary'];
  const map = new maplibregl.Map({
    container: 'map',
    style: { version: 8, sources: {}, layers: [{ id: 'bg', type: 'background', paint: { 'background-color': '#111113' } }],
      light: { anchor: 'viewport', color: '#ffffff', intensity: 0.38, position: [1.2, 200, 35] },
      sky: { 'sky-color': '#111113', 'horizon-color': '#1b1b1f', 'fog-color': '#111113', 'sky-horizon-blend': 0.6, 'horizon-fog-blend': 0.6, 'fog-ground-blend': 0.6 } },
    center: [34.7750, 32.0745], zoom: 14.7, pitch: 62, bearing: -24, maxPitch: 78,
    minZoom: 12.5, maxBounds: [[34.70, 32.00], [34.87, 32.16]], attributionControl: false,
  });

  let active = null, orbiting = false, raf = 0, last = 0;
  const markers = [], chips = [];

  Promise.all([fetch('data.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
               new Promise(res => map.once('load', res))])
  .then(([D]) => {
    document.getElementById('attr').textContent = D.attr;
    const g = decode(D);
    const K = kikarFeatures();
    g.buildings.features.push(...K.bld.map(f => (f.properties.n = HOODS.findIndex(h => h.name === 'כיכר המדינה'), f)));
    g.green.features.push(...K.ground);
    g.water.features.push(K.lake);
    map.addSource('water', { type: 'geojson', data: g.water });
    map.addSource('green', { type: 'geojson', data: g.green });
    map.addSource('roads', { type: 'geojson', data: g.roads });
    map.addSource('glow', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addSource('bld', { type: 'geojson', data: g.buildings });
    map.addLayer({ id: 'green', type: 'fill', source: 'green', paint: { 'fill-color': ['case', ['==', ['get', 's'], 1], '#19181a', '#131614'] } });
    map.addLayer({ id: 'water', type: 'fill', source: 'water', paint: { 'fill-color': '#060709' } });
    map.addLayer({ id: 'roads-minor', type: 'line', source: 'roads', filter: ['!', ['in', ['get', 'c'], ['literal', MAJOR]]],
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#1f1f24', 'line-width': ['interpolate', ['exponential', 1.6], ['zoom'], 13, 0.5, 18, 8] } });
    map.addLayer({ id: 'roads-major', type: 'line', source: 'roads', filter: ['in', ['get', 'c'], ['literal', MAJOR]],
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#2b2b31', 'line-width': ['interpolate', ['exponential', 1.6], ['zoom'], 12, 1.2, 18, 18] } });
    map.addLayer({ id: 'glow', type: 'fill', source: 'glow', paint: { 'fill-color': '#fff', 'fill-opacity': 0.1 } });
    map.addLayer({ id: 'bld', type: 'fill-extrusion', source: 'bld', paint: {
      'fill-extrusion-color': GREY, 'fill-extrusion-height': ['get', 'h'], 'fill-extrusion-base': ['get', 'mh'],
      'fill-extrusion-vertical-gradient': true } });

    const bar = document.getElementById('chips');
    HOODS.forEach((h, i) => {
      const el = document.createElement('div');
      el.className = 'hood'; el.textContent = h.name; el.tabIndex = 0; el.style.setProperty('--c', h.color);
      el.addEventListener('click', e => { e.stopPropagation(); select(i); });
      el.addEventListener('keydown', e => { if (e.key === 'Enter') select(i); });
      new maplibregl.Marker({ element: el, anchor: 'bottom' }).setLngLat(h.c).addTo(map);
      markers.push(el);
      const chip = document.createElement('button');
      chip.className = 'chip'; chip.style.setProperty('--c', h.color); chip.innerHTML = '<i></i>' + h.name;
      chip.addEventListener('click', () => select(i));
      bar.appendChild(chip); chips.push(chip);
    });

    map.on('click', 'bld', e => showCard(e.features[0].properties));
    map.on('mouseenter', 'bld', () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', 'bld', () => map.getCanvas().style.cursor = '');
    map.once('idle', () => document.getElementById('loading').classList.add('done'));
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) startOrbit();
  })
  .catch(err => { document.getElementById('loading').textContent = 'לא הצלחתי לטעון את נתוני הבניינים (' + err.message + '). רעננו את הדף.'; });

  function circle([lng, lat], r, n = 72) {
    const pts = [];
    for (let i = 0; i <= n; i++) { const a = i / n * 2 * Math.PI; pts.push([lng + r / KX * Math.cos(a), lat + r / KY * Math.sin(a)]); }
    return { type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [pts] } };
  }

  function select(i) {
    active = active === i ? null : i;
    markers.forEach((m, j) => m.classList.toggle('on', j === active));
    chips.forEach((c, j) => c.classList.toggle('on', j === active));
    if (active === null) {
      map.getSource('glow').setData({ type: 'FeatureCollection', features: [] });
      map.setPaintProperty('bld', 'fill-extrusion-color', GREY);
      return;
    }
    const h = HOODS[active];
    map.getSource('glow').setData(circle(h.c, h.r));
    map.setPaintProperty('glow', 'fill-color', h.color);
    map.setPaintProperty('bld', 'fill-extrusion-color', ['case', ['==', ['get', 'n'], active],
      ['interpolate', ['linear'], ['get', 'h'], 0, shade(h.color, -0.5), 30, shade(h.color, -0.1), 120, shade(h.color, 0.55)], GREY]);
    stopOrbit();
    map.flyTo({ center: h.c, zoom: 15.7, pitch: 64, bearing: map.getBearing() - 15, duration: 2200, essential: true });
  }

  function showCard(p) {
    document.getElementById('cName').textContent = p.nm || 'בניין';
    document.getElementById('cH').textContent = (p.est ? '~' : '') + Math.round(p.kikar && p.fl >= 37 ? (p.fl === 37 ? 157 : 160) : p.h) + ' מ׳';
    if (p.kikar) {
      document.getElementById('cMeta').textContent = p.fl + ' קומות · בבנייה, צפי סיום 2027–2028 · מיקום מקורב לפי הדמיות הפרויקט';
      document.getElementById('card').hidden = false; return;
    }
    document.getElementById('cMeta').textContent = p.est ? 'גובה משוער לפי גודל הבניין (אין נתון גובה ב-OSM)'
      : (p.fl ? p.fl + ' קומות · ' : '') + (p.fl && !p.nm ? 'גובה מחושב ממספר הקומות' : 'גובה מ-OpenStreetMap');
    document.getElementById('card').hidden = false;
  }
  document.getElementById('cardX').addEventListener('click', () => document.getElementById('card').hidden = true);

  // ---- סיבוב מצלמה איטי ----
  const orbitBtn = document.getElementById('orbit');
  function tick(t) {
    if (!orbiting) return;
    if (last && !map.isMoving()) map.setBearing(map.getBearing() + (t - last) * 0.004);
    last = t; raf = requestAnimationFrame(tick);
  }
  function startOrbit() { orbiting = true; last = 0; orbitBtn.setAttribute('aria-pressed', 'true'); raf = requestAnimationFrame(tick); }
  function stopOrbit() { orbiting = false; cancelAnimationFrame(raf); orbitBtn.setAttribute('aria-pressed', 'false'); }
  orbitBtn.addEventListener('click', () => orbiting ? stopOrbit() : startOrbit());
  ['mousedown', 'touchstart', 'wheel'].forEach(ev => map.on(ev, stopOrbit));

  // ---- 2D / 3D ----
  const dimBtn = document.getElementById('dim');
  dimBtn.addEventListener('click', () => {
    const to2d = dimBtn.getAttribute('aria-pressed') === 'true';
    dimBtn.setAttribute('aria-pressed', String(!to2d));
    if (to2d) stopOrbit();
    map.easeTo({ pitch: to2d ? 0 : 62, bearing: to2d ? 0 : -24, duration: 1200 });
    map.setPaintProperty('bld', 'fill-extrusion-height', to2d ? 0 : ['get', 'h']);
    map.setPaintProperty('bld', 'fill-extrusion-base', to2d ? 0 : ['get', 'mh']);
  });
</script>
</body>
</html>
